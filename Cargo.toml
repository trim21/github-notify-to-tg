[package]
name = "github-notify-to-tg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
html-escape = "0.2.14"
octocrab = "0.54.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.42", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres"] }
tokio = { version = "1.53.0", features = ["rt-multi-thread", "net", "time", "macros", "signal"] }
