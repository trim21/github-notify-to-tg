[package]
name = "github-notify-to-tg"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
html-escape = "0.2.15"
octocrab = "0.54.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = { version = "0.23.43", features = ["aws_lc_rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "postgres"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "macros", "signal"] }
